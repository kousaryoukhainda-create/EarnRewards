# Project-wide Gradle settings - OPTIMIZED FOR LOW MEMORY
# Adjusted for systems with limited RAM (~1-2GB available)
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:+UseParallelGC -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Enable build cache for faster incremental builds
org.gradle.caching=true
org.gradle.parallel=false

# Enable daemon for faster subsequent builds
org.gradle.daemon=true
org.gradle.configureondemand=true

# AAPT2 - COMPLETELY DISABLE DAEMON MODE
android.enableAapt2Daemon=false
android.aapt2.noVersionCheck=true
android.enableResourceOptimizations=false
android.builder.sdkDirectory=/opt/android_sdk
android.experimental.enableAapt2Worker=false
android.experimental.enableNewResourceShrinker=false

# Kotlin optimizations
kotlin.incremental=true
kotlin.caching.enabled=true

# Disable unused features
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
